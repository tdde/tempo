    function toggleExercise(i) {
      const row = document.getElementById(`exrow-${i}`);
      const notes = document.getElementById(`exnotes-${i}`);
      row.classList.toggle('expanded');
      notes.classList.toggle('open');
    }

    /* ============================================================
       ACTIVE WORKOUT ENGINE
       ============================================================ */
    let workout = null;
    let timerRaf = null;

    function startWorkout(day) {
      const routine = appData.schedule[day];
      if (!routine || !routine.exercises || routine.exercises.length === 0) {
        showModal('No exercises', 'This day has no exercises scheduled.');
        return;
      }

      ensureAudio();

      workout = {
        day,
        routineName: routine.name,
        exercises: JSON.parse(JSON.stringify(routine.exercises)),
        currentExIndex: 0,
        currentSet: 1,
        phase: 'prep',
        timer: 0,
        totalElapsed: 0,
        paused: false,
        intervalId: null,
        totalTimerId: null,
        setLogs: [],
        isTimed: false,
        targetDuration: 0,
        restDuration: 0,
        restRemaining: 0,
        completedExercises: 0,
        totalExercises: routine.exercises.length,
        lastTickTime: 0,
        rafId: null
      };

      prepareExercise();
      document.getElementById('workoutOverlay').classList.add('active');
      document.getElementById('workoutOverlay').dataset.phase = workout.phase;
      document.getElementById('tabBarContainer').style.display = 'none';
      document.getElementById('completionScreen').classList.remove('active');
      document.getElementById('pausePanel').classList.remove('active');
      document.getElementById('workoutOverlay').classList.remove('dimmed');
      document.body.style.overflow = 'hidden';

      startTotalTimer();
      runPhase();
    }

    function prepareExercise() {
      const ex = workout.exercises[workout.currentExIndex];
      workout.isTimed = !!ex.durationSeconds;
      if (workout.isTimed) {
        workout.phase = 'prep';
        workout.timer = 5;
        workout.targetDuration = ex.durationSeconds;
      } else {
        workout.phase = 'exercise';
        workout.timer = 0;
      }
      workout.restDuration = ex.restSeconds || 60;
      updateWorkoutUI();
    }

    function runPhase() {
      clearInterval(workout.intervalId);
      if (workout.phase === 'done') return;

      if (workout.phase === 'prep') {
        workout.intervalId = setInterval(() => {
          if (workout.paused) return;
          workout.timer--;
          if (workout.timer <= 0) {
            clearInterval(workout.intervalId);
            playAlert();
            vibrate([100, 50, 100]);
            workout.phase = 'exercise';
            workout.timer = workout.targetDuration;
            document.getElementById('workoutOverlay').dataset.phase = 'exercise';
            runPhase();
          }
          updateWorkoutUI();
          animateTimerTick();
        }, 1000);
      } else if (workout.phase === 'exercise') {
        if (workout.isTimed) {
          workout.intervalId = setInterval(() => {
            if (workout.paused) return;
            workout.timer--;
            if (workout.timer <= 0) {
              clearInterval(workout.intervalId);
              workout.timer = 0;
              updateWorkoutUI();
              playAlert();
              vibrate([100, 50, 100]);
              setTimeout(() => startRestWithLogging(), 200);
              return;
            }
            updateWorkoutUI();
            animateTimerTick();
            if (workout.timer <= 3 && workout.timer > 0) playTick();
          }, 1000);
        } else {
          workout.timer = 0;
          updateWorkoutUI();
        }
      } else if (workout.phase === 'rest') {
        workout.intervalId = setInterval(() => {
          if (workout.paused) return;
          workout.restRemaining--;
          workout.timer = workout.restRemaining;
          if (workout.restRemaining <= 0) {
            clearInterval(workout.intervalId);
            playAlert();
            vibrate([100, 50, 100]);
            endRestAndAdvance();
            return;
          }
          updateWorkoutUI();
          animateTimerTick();
          if (workout.restRemaining <= 3 && workout.restRemaining > 0) playTick();
        }, 1000);
      }
    }

    function animateTimerTick() {
      const el = document.getElementById('timerValue');
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }

    function startRestWithLogging() {
      workout.phase = 'rest';
      workout.restRemaining = workout.restDuration;
      workout.timer = workout.restDuration;
      document.getElementById('workoutOverlay').dataset.phase = 'rest';
      showLogCard();
      updateWorkoutUI();
      runPhase();
    }

    function showLogCard() {
      const ex = workout.exercises[workout.currentExIndex];
      const area = document.getElementById('restLogArea');
      const defaultReps = ex.targetReps ? parseInt(ex.targetReps.split('-')[0]) || 10 : 10;

      area.innerHTML = `
        <div class="log-card">
          <div class="log-header">
            <div class="log-title">Log Set ${workout.currentSet}</div>
            <div class="log-badge">Rest</div>
          </div>
          <div class="log-row">
            <div class="log-row-label">Reps</div>
            <div class="stepper">
              <button class="stepper-btn" onclick="adjustLog('reps',-1)">−</button>
              <input type="number" class="stepper-input mono" id="logReps" value="${defaultReps}" inputmode="numeric" />
              <button class="stepper-btn" onclick="adjustLog('reps',1)">+</button>
            </div>
          </div>
          <div class="bw-toggle active" id="bwToggle" onclick="toggleBodyweight()">
            <div class="bw-toggle-label">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a4 4 0 0 1 4 4c0 1.5-1 3-2 4l1 2h-6l1-2c-1-1-2-2.5-2-4a4 4 0 0 1 4-4z"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
              Bodyweight
            </div>
            <div class="bw-switch"></div>
          </div>
          <div class="weight-input-wrap" id="weightWrap">
            <div class="log-row" style="margin-bottom:0;">
              <div class="log-row-label">Added</div>
              <div class="stepper">
                <button class="stepper-btn" onclick="adjustLog('weight',-5)">−</button>
                <input type="number" class="stepper-input mono" id="logWeight" value="0" inputmode="numeric" placeholder="0" />
                <button class="stepper-btn" onclick="adjustLog('weight',5)">+</button>
              </div>
            </div>
          </div>
          <div class="field" style="margin-top:10px;">
            <div class="field-label">Notes</div>
            <textarea class="log-notes" id="logNotes" placeholder="Optional notes..."></textarea>
          </div>
        </div>`;
    }

    function toggleBodyweight() {
      const toggle = document.getElementById('bwToggle');
      const wrap = document.getElementById('weightWrap');
      const isBW = toggle.classList.toggle('active');
      wrap.classList.toggle('show', !isBW);
    }

    function adjustLog(field, delta) {
      const input = document.getElementById(field === 'weight' ? 'logWeight' : 'logReps');
      if (input) {
        let val = parseFloat(input.value) || 0;
        val = Math.max(0, val + delta);
        input.value = val;
      }
    }

    function endRestAndAdvance() {
      const reps = parseInt(document.getElementById('logReps')?.value) || 0;
      const weightInput = document.getElementById('logWeight');
      const weight = weightInput ? parseFloat(weightInput.value) || 0 : 0;
      const notes = document.getElementById('logNotes')?.value || '';
      const isBW = document.getElementById('bwToggle')?.classList.contains('active') ?? true;

      const ex = workout.exercises[workout.currentExIndex];
      workout.setLogs.push({
        exercise: ex.name,
        set: workout.currentSet,
        weight: isBW ? 0 : weight,
        reps,
        notes,
        isBodyweight: isBW,
        timestamp: Date.now()
      });

      updatePRs(ex.name, isBW ? 0 : weight, reps);
      document.getElementById('restLogArea').innerHTML = '';

      if (!workout.isTimed && workout.currentSet < (ex.sets || 1)) {
        workout.currentSet++;
        workout.phase = 'exercise';
        workout.timer = 0;
        document.getElementById('workoutOverlay').dataset.phase = 'exercise';
        updateWorkoutUI();
        runPhase();
      } else {
        workout.completedExercises++;
        workout.currentExIndex++;
        workout.currentSet = 1;
        if (workout.currentExIndex >= workout.exercises.length) {
          finishWorkout();
        } else {
          prepareExercise();
          document.getElementById('workoutOverlay').dataset.phase = workout.phase;
          runPhase();
        }
      }
    }

    function updatePRs(exerciseName, weight, reps) {
      if (reps <= 0) return;
      if (!appData.prs[exerciseName]) {
        appData.prs[exerciseName] = { maxReps: 0, maxWeight: 0, maxVolume: 0 };
      }
      const pr = appData.prs[exerciseName];
      let isNewPR = false;
      if (reps > pr.maxReps) { pr.maxReps = reps; isNewPR = true; }
      if (weight > pr.maxWeight) { pr.maxWeight = weight; isNewPR = true; }
      const vol = (weight || 0) * reps;
      if (vol > pr.maxVolume) { pr.maxVolume = vol; isNewPR = true; }
      saveData(appData);
      if (isNewPR) {
        playPR();
        showToast('🏆 New Personal Record!', 'success');
      }
    }

    function finishWorkout() {
      clearInterval(workout.intervalId);
      clearInterval(workout.totalTimerId);

      const totalReps = workout.setLogs.reduce((s, l) => s + (l.reps || 0), 0);
      const log = {
        id: uid(),
        date: new Date().toISOString(),
        day: workout.day,
        routineName: workout.routineName,
        totalTime: workout.totalElapsed,
        exercises: workout.setLogs,
        totalVolume: workout.setLogs.reduce((s, l) => s + ((l.weight || 0) * l.reps || 0), 0),
        totalReps
      };

      appData.logs.push(log);
      saveData(appData);

      workout.phase = 'done';
      document.getElementById('workoutOverlay').dataset.phase = 'done';
      document.getElementById('restLogArea').innerHTML = '';
      document.getElementById('dynamicActions').innerHTML = '';

      playComplete();
      vibrate([100, 50, 100, 50, 200]);

      // Show completion screen with counting animation
      const comp = document.getElementById('completionScreen');
      comp.classList.add('active');
      document.getElementById('completionSub').textContent = `${workout.routineName} · ${workout.setLogs.length} sets`;

      const timeEl = document.getElementById('compTime');
      const setsEl = document.getElementById('compSets');
      const repsEl = document.getElementById('compReps');
      timeEl.textContent = '0:00';
      setsEl.textContent = '0';
      repsEl.textContent = '0';

      setTimeout(() => {
        animateNumber(timeEl, workout.totalElapsed, 900, v => formatTime(Math.round(v)));
        animateNumber(setsEl, workout.setLogs.length, 900, v => Math.round(v));
        animateNumber(repsEl, totalReps, 900, v => Math.round(v));
      }, 400);
    }

    function endWorkout() {
      clearInterval(workout?.intervalId);
      clearInterval(workout?.totalTimerId);
      document.getElementById('workoutOverlay').classList.remove('active');
      document.getElementById('workoutOverlay').classList.remove('dimmed');
      document.getElementById('completionScreen').classList.remove('active');
      document.getElementById('pausePanel').classList.remove('active');
      document.getElementById('tabBarContainer').style.display = '';
      document.body.style.overflow = '';
      document.getElementById('restLogArea').innerHTML = '';
      document.getElementById('dynamicActions').innerHTML = '';
      workout = null;
      renderWorkoutScreen();
      renderAnalytics();
    }

    function updateWorkoutUI() {
      if (!workout) return;
      const ex = workout.exercises[workout.currentExIndex];
      document.getElementById('woExerciseName').textContent = ex.name;

      // Set info
      let setInfo = '';
      if (workout.isTimed) {
        setInfo = `Timed hold · ${workout.targetDuration}s`;
      } else {
        setInfo = `Set ${workout.currentSet} of ${ex.sets} · Target ${ex.targetReps}`;
      }
      document.getElementById('woSetInfo').textContent = setInfo;

      // Progress dots
      renderProgressDots();

      // Timer value
      const timerEl = document.getElementById('timerValue');
      const phaseLabel = document.getElementById('timerPhaseLabel');
      const ring = document.getElementById('ringProgress');
      const circumference = 2 * Math.PI * 105;

      let progress = 0;
      let valueText = '';
      let urgent = false, critical = false;

      if (workout.phase === 'prep') {
        progress = 1 - (workout.timer / 5);
        valueText = String(workout.timer);
        phaseLabel.textContent = 'GET READY';
      } else if (workout.phase === 'exercise') {
        if (workout.isTimed) {
          progress = 1 - (workout.timer / workout.targetDuration);
          valueText = formatTime(workout.timer);
          phaseLabel.textContent = 'EXERCISE';
          if (workout.timer <= 10) urgent = true;
          if (workout.timer <= 3) critical = true;
        } else {
          progress = 0;
          valueText = ex.targetReps || '—';
          timerEl.classList.add('reps-mode');
          phaseLabel.textContent = 'REPS';
        }
      } else if (workout.phase === 'rest') {
        progress = 1 - (workout.restRemaining / workout.restDuration);
        valueText = formatTime(workout.restRemaining);
        phaseLabel.textContent = 'REST';
        if (workout.restRemaining <= 10) urgent = true;
        if (workout.restRemaining <= 3) critical = true;
      } else {
        valueText = '0:00';
        phaseLabel.textContent = 'DONE';
      }

      if (!(workout.phase === 'exercise' && !workout.isTimed)) {
        timerEl.classList.remove('reps-mode');
      }
      timerEl.textContent = valueText;
      timerEl.classList.toggle('urgent', urgent && !critical);
      timerEl.classList.toggle('critical', critical);

      ring.style.strokeDashoffset = circumference * (1 - progress);

      // Next up preview
      const nextUp = document.getElementById('nextUp');
      if (workout.phase === 'rest') {
        nextUp.innerHTML = `Up next · <span class="next-name">${ex.name} · Set ${workout.currentSet + 1 <= (ex.sets || 1) ? workout.currentSet + 1 : 'next'}</span>`;
      } else if (workout.currentExIndex < workout.exercises.length - 1) {
        const nextEx = workout.exercises[workout.currentExIndex + 1];
        nextUp.innerHTML = `Next · <span class="next-name">${nextEx.name}</span>`;
      } else {
        nextUp.innerHTML = '';
      }

      renderDynamicActions();
    }

    function renderProgressDots() {
      const container = document.getElementById('woProgress');
      const total = workout.totalExercises;
      let html = '';
      for (let i = 0; i < total; i++) {
        let cls = 'wo-progress-dot';
        if (i < workout.completedExercises) cls += ' done';
        else if (i === workout.currentExIndex) cls += ' current';
        html += `<div class="${cls}"></div>`;
      }
      container.innerHTML = html;
    }

    function renderDynamicActions() {
      const container = document.getElementById('dynamicActions');
      if (!workout) { container.innerHTML = ''; return; }

      let html = '';

      if (workout.phase === 'prep') {
        html = `<button class="btn btn-primary btn-full" onclick="skipPrep()">${ICONS.skip} Skip Prep</button>`;
      } else if (workout.phase === 'exercise') {
        if (workout.isTimed) {
          html = `<button class="btn btn-green btn-full" onclick="completeExercise()">${ICONS.check} Complete Exercise</button>`;
        } else {
          html = `<button class="btn btn-green btn-full" onclick="completeSet()">${ICONS.check} Complete Set</button>`;
        }
      } else if (workout.phase === 'rest') {
        html = `
          <button class="btn btn-primary btn-full" onclick="skipRest()">${ICONS.skip} Skip Rest</button>
          <div class="action-row">
            <button class="btn btn-secondary" onclick="add30sRest()">${ICONS.plus} 30s</button>
            <button class="btn btn-red" onclick="confirmEndWorkout()">${ICONS.end} End</button>
          </div>`;
      }

      container.innerHTML = html;
    }

    function startTotalTimer() {
      workout.totalTimerId = setInterval(() => {
        if (!workout.paused) {
          workout.totalElapsed++;
          document.getElementById('totalTimer').textContent = formatTime(workout.totalElapsed);
        }
      }, 1000);
    }

    function completeSet() {
      playAlert();
      vibrate([100, 50, 100]);
      startRestWithLogging();
    }

    function completeExercise() {
      playAlert();
      vibrate([100, 50, 100]);
      startRestWithLogging();
    }

    function skipPrep() {
      clearInterval(workout.intervalId);
      workout.phase = 'exercise';
      workout.timer = workout.targetDuration || 0;
      document.getElementById('workoutOverlay').dataset.phase = 'exercise';
      updateWorkoutUI();
      runPhase();
    }

    function skipRest() {
      if (workout.phase === 'rest') {
        clearInterval(workout.intervalId);
        workout.restRemaining = 0;
        endRestAndAdvance();
      }
    }

    function add30sRest() {
      if (workout.phase === 'rest') {
        workout.restRemaining += 30;
        workout.timer = workout.restRemaining;
        updateWorkoutUI();
        showToast('+30s rest added', 'info', 1400);
      }
    }

    function togglePause() {
      if (!workout) return;
      workout.paused = !workout.paused;

      const pausePanel = document.getElementById('pausePanel');
      const overlay = document.getElementById('workoutOverlay');
      const pauseBtn = document.getElementById('pauseBtn');

      if (workout.paused) {
        overlay.classList.add('dimmed');
        pausePanel.classList.add('active');
        updatePauseTime();
        pauseBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Resume`;
      } else {
        overlay.classList.remove('dimmed');
        pausePanel.classList.remove('active');
        pauseBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg> Pause`;
      }
    }

    function updatePauseTime() {
      if (!workout) return;
      const el = document.getElementById('pauseTime');
      if (workout.phase === 'exercise' && workout.isTimed) el.textContent = formatTime(workout.timer);
      else if (workout.phase === 'rest') el.textContent = formatTime(workout.restRemaining);
      else if (workout.phase === 'prep') el.textContent = workout.timer + 's';
      else el.textContent = '—';
    }

    function confirmEndWorkout() {
      workout.paused = true;
      showModal('End Workout?', 'Your progress for this session will be lost.', () => {
        endWorkout();
      }, 'End Workout', true);
    }

    /* ============================================================
       EDITOR
       ============================================================ */
    let editingDay = null;

    function renderEditor() {
      const el = document.getElementById('screen-editor');
      let html = `<div style="padding-top:16px;"><h1 class="title-1 mb-16">Editor</h1>`;

      // Day selector
      html += `<div class="day-selector">`;
      DAYS.forEach(d => {
        const active = editingDay === d;
        html += `<button class="day-chip ${active ? 'active' : ''}" onclick="editDay('${d}')">${DAY_SHORT[DAYS.indexOf(d)]}</button>`;
      });
      html += `</div>`;

      if (editingDay) {
        const routine = appData.schedule[editingDay] || { name: '', muscles: '', estimatedMinutes: 40, exercises: [] };

        html += `
          <div class="surface mb-12">
            <div class="field mb-12">
              <div class="field-label">Routine Name</div>
              <input class="field-input" type="text" id="editName" value="${routine.name}" />
            </div>
            <div class="field mb-12">
              <div class="field-label">Target Muscles</div>
              <input class="field-input" type="text" id="editMuscles" value="${routine.muscles || ''}" placeholder="e.g. Chest · Shoulders · Triceps" />
            </div>
            <div class="field">
              <div class="field-label">Estimated Minutes</div>
              <div class="stepper-mini">
                <button onclick="adjustField('editMinutes',-5)">−</button>
                <input type="number" id="editMinutes" value="${routine.estimatedMinutes || 40}" inputmode="numeric" />
                <button onclick="adjustField('editMinutes',5)">+</button>
              </div>
            </div>
          </div>

          <div class="section-title">Exercises</div>
          <div id="exerciseEditorList">`;

        routine.exercises.forEach((ex, i) => {
          html += renderExerciseEditor(ex, i);
        });

        html += `</div>
          <button class="btn btn-secondary btn-full mt-12" onclick="addExercise()">${ICONS.plus} Add Exercise</button>
          <button class="btn btn-primary btn-full mt-12" onclick="saveDay()" style="margin-bottom:24px;">Save Routine</button>
        </div>`;
      } else {
        html += `<div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <div class="headline mb-8">Select a day to edit</div>
          <p class="caption">Choose a day above to customize your workout.</p>
        </div></div>`;
      }

      el.innerHTML = html;
      el.classList.add('stagger');
    }

    function renderExerciseEditor(ex, i) {
      const isTimed = !!ex.durationSeconds;
      return `
        <div class="editor-exercise" id="editEx-${i}">
          <div class="editor-exercise-head">
            <div class="drag-handle" title="Reorder">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>
            </div>
            <div class="editor-exercise-num mono">${String(i + 1).padStart(2, '0')}</div>
            <input class="editor-exercise-title" type="text" value="${ex.name}" onchange="updateExercise(${i},'name',this.value)" />
            <button class="icon-btn" onclick="moveExercise(${i},-1)" title="Move up">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 15l-6-6-6 6"/></svg>
            </button>
            <button class="icon-btn" onclick="moveExercise(${i},1)" title="Move down">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button class="icon-btn danger" onclick="removeExercise(${i})" title="Remove">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="type-toggle">
            <div class="type-toggle-pill ${isTimed ? 'right' : ''}"></div>
            <button class="${!isTimed ? 'active' : ''}" onclick="setExerciseType(${i},'reps')">Reps</button>
            <button class="${isTimed ? 'active' : ''}" onclick="setExerciseType(${i},'timed')">Timed</button>
          </div>

          ${isTimed ? `
            <div class="editor-grid">
              <div class="field">
                <div class="field-label">Duration (sec)</div>
                <div class="stepper-mini">
                  <button onclick="adjustExercise(${i},'durationSeconds',-5)">−</button>
                  <input type="number" value="${ex.durationSeconds}" inputmode="numeric" onchange="updateExercise(${i},'durationSeconds',parseInt(this.value)||30)" />
                  <button onclick="adjustExercise(${i},'durationSeconds',5)">+</button>
                </div>
              </div>
              <div class="field">
                <div class="field-label">Rest (sec)</div>
                <div class="stepper-mini">
                  <button onclick="adjustExercise(${i},'restSeconds',-15)">−</button>
                  <input type="number" value="${ex.restSeconds}" inputmode="numeric" onchange="updateExercise(${i},'restSeconds',parseInt(this.value)||30)" />
                  <button onclick="adjustExercise(${i},'restSeconds',15)">+</button>
                </div>
              </div>
            </div>
          ` : `
            <div class="editor-grid">
              <div class="field">
                <div class="field-label">Sets</div>
                <div class="stepper-mini">
                  <button onclick="adjustExercise(${i},'sets',-1)">−</button>
                  <input type="number" value="${ex.sets || 3}" inputmode="numeric" onchange="updateExercise(${i},'sets',parseInt(this.value)||1)" />
                  <button onclick="adjustExercise(${i},'sets',1)">+</button>
                </div>
              </div>
              <div class="field">
                <div class="field-label">Target Reps</div>
                <input class="field-input" type="text" value="${ex.targetReps || ''}" placeholder="8-12" onchange="updateExercise(${i},'targetReps',this.value)" />
              </div>
            </div>
            <div class="field mb-12">
              <div class="field-label">Rest (sec)</div>
              <div class="stepper-mini">
                <button onclick="adjustExercise(${i},'restSeconds',-15)">−</button>
                <input type="number" value="${ex.restSeconds}" inputmode="numeric" onchange="updateExercise(${i},'restSeconds',parseInt(this.value)||30)" />
                <button onclick="adjustExercise(${i},'restSeconds',15)">+</button>
              </div>
            </div>
          `}

          <div class="field">
            <div class="field-label">Notes</div>
            <textarea class="field-textarea" placeholder="Form cues, tempo, etc." onchange="updateExercise(${i},'notes',this.value)">${ex.notes || ''}</textarea>
          </div>
        </div>`;
    }

    function editDay(day) {
      editingDay = day;
      renderEditor();
    }

    function addExercise() {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay] || { name: editingDay, muscles: '', estimatedMinutes: 40, exercises: [] };
      routine.exercises.push({
        name: "New Exercise",
        sets: 3,
        targetReps: "8-12",
        restSeconds: 60,
        notes: ""
      });
      appData.schedule[editingDay] = routine;
      saveData(appData);
      renderEditor();
    }

    function removeExercise(index) {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay];
      routine.exercises.splice(index, 1);
      saveData(appData);
      renderEditor();
    }

    function moveExercise(index, dir) {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay];
      const newIndex = index + dir;
      if (newIndex < 0 || newIndex >= routine.exercises.length) return;

      const card = document.getElementById(`editEx-${index}`);
      if (card) {
        card.classList.add('reordering');
        setTimeout(() => {
          const temp = routine.exercises[index];
          routine.exercises[index] = routine.exercises[newIndex];
          routine.exercises[newIndex] = temp;
          saveData(appData);
          renderEditor();
        }, 180);
      }
    }

    function updateExercise(index, field, value) {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay];
      routine.exercises[index][field] = value;
      saveData(appData);
    }

    function adjustExercise(index, field, delta) {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay];
      const ex = routine.exercises[index];
      ex[field] = Math.max(0, (ex[field] || 0) + delta);
      saveData(appData);
      renderEditor();
    }

    function setExerciseType(index, type) {
      if (!editingDay) return;
      const routine = appData.schedule[editingDay];
      const ex = routine.exercises[index];
      if (type === 'timed') {
        delete ex.sets;
        delete ex.targetReps;
        ex.durationSeconds = 60;
      } else {
        delete ex.durationSeconds;
        ex.sets = 3;
        ex.targetReps = "8-12";
      }
      saveData(appData);
      renderEditor();
    }

    function adjustField(id, delta) {
      const input = document.getElementById(id);
      if (input) {
        let val = parseInt(input.value) || 0;
        val = Math.max(0, val + delta);
        input.value = val;
      }
    }

    function saveDay() {
      if (!editingDay) return;
      const name = document.getElementById('editName')?.value || editingDay;
      const muscles = document.getElementById('editMuscles')?.value || '';
      const minutes = parseInt(document.getElementById('editMinutes')?.value) || 40;
      if (!appData.schedule[editingDay]) appData.schedule[editingDay] = { exercises: [] };
      appData.schedule[editingDay].name = name;
      appData.schedule[editingDay].muscles = muscles;
      appData.schedule[editingDay].estimatedMinutes = minutes;
      saveData(appData);
      showToast('Routine saved', 'success');
    }

    /* ============================================================
       ANALYTICS
       ============================================================ */
    let charts = {};

    function renderAnalytics() {
      const el = document.getElementById('screen-analytics');
      const logs = appData.logs;

      const totalWorkouts = logs.length;
      const totalReps = logs.reduce((s, l) => s + (l.totalReps || 0), 0);
      const totalTime = logs.reduce((s, l) => s + (l.totalTime || 0), 0);
      const streak = calculateStreak();

      let html = `<div style="padding-top:16px;">
        <h1 class="title-1 mb-16">Progress</h1>

        <div class="stat-grid">
          <div class="stat-card accent-blue">
            <div class="stat-value mono" id="statWorkouts">0</div>
            <div class="stat-label">Workouts</div>
          </div>
          <div class="stat-card accent-green">
            <div class="stat-value mono" id="statReps">0</div>
            <div class="stat-label">Total Reps</div>
          </div>
          <div class="stat-card accent-purple">
            <div class="stat-value mono" id="statTime">0m</div>
            <div class="stat-label">Time Trained</div>
          </div>
          <div class="stat-card accent-orange">
            <div class="stat-value mono" id="statStreak">0</div>
            <div class="stat-label">Day Streak</div>
          </div>
        </div>`;

      // Heatmap
      html += `<div class="surface mb-12">
        <div class="section-title" style="margin-top:0;">Consistency</div>
        <div class="heatmap" id="heatmap"></div>
      </div>`;

      // PRs
      html += `<div class="surface mb-12">
        <div class="section-title" style="margin-top:0;">Personal Records</div>`;
      const prKeys = Object.keys(appData.prs);
      if (prKeys.length === 0) {
        html += `<p class="caption">No PRs yet. Complete a workout to set records.</p>`;
      } else {
        prKeys.slice(0, 8).forEach(ex => {
          const pr = appData.prs[ex];
          html += `
            <div class="pr-row">
              <div class="pr-name">${ex}</div>
              <div class="pr-badges">
                <span class="pr-badge">🔁 ${pr.maxReps}</span>
                ${pr.maxWeight > 0 ? `<span class="pr-badge">🏋️ +${pr.maxWeight}</span>` : ''}
              </div>
            </div>`;
        });
      }
      html += `</div>`;

      // History
      html += `<div class="section-title">History</div>`;
      if (logs.length === 0) {
        html += `<div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <div class="headline mb-8">No workouts yet</div>
          <p class="caption">Complete your first workout to see history here.</p>
        </div>`;
      } else {
        logs.slice().reverse().slice(0, 15).forEach(log => {
          const d = new Date(log.date);
          const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          html += `
            <div class="history-item" onclick="showLogDetail('${log.id}')">
              <div>
                <div class="history-date">${dateStr}</div>
                <div class="history-name">${log.routineName || log.day}</div>
                <div class="history-meta">${formatDuration(log.totalTime)} · ${log.exercises.length} sets</div>
              </div>
              <div>
                <div class="history-reps mono">${log.totalReps || 0}</div>
                <div class="history-reps-label">reps</div>
              </div>
            </div>`;
        });
      }
      html += `</div>`;

      el.innerHTML = html;
      el.classList.add('stagger');

      // Animate stats
      setTimeout(() => {
        animateNumber(document.getElementById('statWorkouts'), totalWorkouts, 800);
        animateNumber(document.getElementById('statReps'), totalReps, 900);
        animateNumber(document.getElementById('statTime'), totalTime, 900, v => formatDuration(Math.round(v)));
        animateNumber(document.getElementById('statStreak'), streak, 700);
      }, 200);

      renderHeatmap();
    }

    function calculateStreak() {
      const dates = new Set(appData.logs.map(l => new Date(l.date).toDateString()));
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        if (dates.has(d.toDateString())) streak++;
        else if (i > 0) break;
      }
      return streak;
    }

    function renderHeatmap() {
      const container = document.getElementById('heatmap');
      if (!container) return;
      const days = 35;
      const now = new Date();
      const logDates = new Set(appData.logs.map(l => new Date(l.date).toDateString()));

      let html = '';
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const active = logDates.has(d.toDateString());
        const cls = active ? 'heatmap-cell active' : 'heatmap-cell';
        html += `<div class="${cls}" style="animation-delay:${(days - i) * 8}ms" title="${d.toDateString()}"></div>`;
      }
      container.innerHTML = html;
    }

    function showLogDetail(logId) {
      const log = appData.logs.find(l => l.id === logId);
      if (!log) return;
      const d = new Date(log.date);
      let html = `
        <h3>${log.routineName || log.day}</h3>
        <p>${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })} · ${formatDuration(log.totalTime)}</p>
        <div style="max-height:50vh;overflow-y:auto;margin-bottom:16px;">`;
      log.exercises.forEach(e => {
        const weightText = e.isBodyweight ? 'Bodyweight' : `+${e.weight} lbs`;
        html += `
          <div style="padding:10px 0;border-bottom:1px solid var(--border);">
            <div class="flex justify-between" style="margin-bottom:3px;">
              <strong style="font-size:14px;">${e.exercise}</strong>
              <span class="caption">Set ${e.set}</span>
            </div>
            <div class="caption">${weightText} × ${e.reps} reps${e.notes ? ' · ' + e.notes : ''}</div>
          </div>`;
      });
      html += `</div>
        <button class="btn btn-secondary btn-full" onclick="closeModal()">Close</button>`;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
    }

    /* ============================================================
       SETTINGS
       ============================================================ */
    function renderSettings() {
      const el = document.getElementById('screen-settings');
      const s = appData.settings;
      el.innerHTML = `
        <div style="padding-top:16px;">
          <h1 class="title-1 mb-16">Settings</h1>

          <div class="settings-group">
            <div class="settings-group-label">Workout</div>
            <div class="settings-group-inner">
              <div class="toggle-row">
                <div class="toggle-row-label">
                  <div class="toggle-row-icon" style="background:rgba(10,132,255,0.14);color:var(--blue-bright);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                  </div>
                  Auto-detect Today's Routine
                </div>
                <div class="toggle ${s.autoDetectDay ? 'on' : ''}" onclick="toggleSetting('autoDetectDay')"></div>
              </div>
              <div class="toggle-row">
                <div class="toggle-row-label">
                  <div class="toggle-row-icon" style="background:rgba(48,209,88,0.14);color:var(--green-bright);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  </div>
                  Sound Alerts
                </div>
                <div class="toggle ${s.soundAlerts ? 'on' : ''}" onclick="toggleSetting('soundAlerts')"></div>
              </div>
              <div class="toggle-row">
                <div class="toggle-row-label">
                  <div class="toggle-row-icon" style="background:rgba(255,159,12,0.14);color:var(--orange);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                  </div>
                  Vibration Feedback
                </div>
                <div class="toggle ${s.vibration ? 'on' : ''}" onclick="toggleSetting('vibration')"></div>
              </div>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-group-label">Data</div>
            <div class="settings-group-inner">
              <div class="settings-btn-row" onclick="copyAIPrompt()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue-bright)" stroke-width="2" stroke-linecap="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
                Copy AI Template Prompt
              </div>
              <div class="settings-btn-row" onclick="openImportModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--green-bright)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                Import JSON Schedule
              </div>
              <div class="settings-btn-row" onclick="exportData()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                Export All Data
              </div>
              <div class="settings-btn-row danger" onclick="clearData()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Clear Local Data
              </div>
            </div>
          </div>

          <div class="text-center caption" style="margin-top:24px;opacity:0.5;">
            Calisthenics Tracker · v1.0
          </div>
        </div>`;
      el.classList.add('stagger');
    }

    function toggleSetting(key) {
      appData.settings[key] = !appData.settings[key];
      saveData(appData);
      renderSettings();
      renderWorkoutScreen();
    }

    function openImportModal() {
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <h3>Import Schedule</h3>
        <p>Paste your JSON workout schedule below.</p>
        <textarea id="importJson" class="field-textarea" style="min-height:160px;margin-bottom:16px;" placeholder='{"schedule":{"Monday":{...}}}'></textarea>
        <div class="flex gap-10">
          <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" style="flex:1;" onclick="doImport()">Import</button>
        </div>`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function doImport() {
      const raw = document.getElementById('importJson')?.value;
      if (!raw) { showToast('Please paste JSON first', 'warn'); return; }
      try {
        const parsed = JSON.parse(raw);
        if (parsed.schedule) {
          appData.schedule = { ...appData.schedule, ...parsed.schedule };
          saveData(appData);
          renderWorkoutScreen();
          renderEditor();
          closeModal();
          showToast('Schedule imported', 'success');
        } else {
          showToast('JSON must contain a "schedule" key', 'warn');
        }
      } catch (e) {
        showToast('Invalid JSON: ' + e.message, 'warn');
      }
    }

    function copyAIPrompt() {
      const prompt = `Convert the following calisthenics workout notes into this exact JSON format:

{
  "schedule": {
    "Monday": {
      "name": "Push Day",
      "muscles": "Chest · Shoulders · Triceps",
      "estimatedMinutes": 40,
      "exercises": [
        { "name": "Push-ups", "sets": 4, "targetReps": "15-20", "restSeconds": 60, "notes": "Full range" }
      ]
    }
  }
}

Rules:
- Use "durationSeconds" instead of sets/targetReps for timed exercises (e.g., Plank Hold).
- Include all 7 days or only the days provided.
- Each exercise can have: name, sets, targetReps, durationSeconds, restSeconds, notes.
- Ensure valid JSON.

Workout notes:
[PASTE YOUR WORKOUT NOTES HERE]`;

      navigator.clipboard.writeText(prompt).then(() => {
        showToast('AI prompt copied to clipboard', 'success');
      }).catch(() => {
        showToast('Copy failed — please copy manually', 'warn');
      });
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `calisthenics-data-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Data exported', 'success');
    }

    function clearData() {
      showModal('Clear All Data?', 'This will permanently delete all workouts, schedules, and PRs. This cannot be undone.', () => {
        localStorage.removeItem(STORAGE_KEY);
        appData = loadData();
        saveData(appData);
        editingDay = null;
        renderWorkoutScreen();
        renderEditor();
        renderAnalytics();
        renderSettings();
        showToast('All data cleared', 'info');
      }, 'Clear Data', true);
    }

    /* ============================================================
       TAB NAVIGATION
       ============================================================ */
    let currentTab = 'workout';

    function switchTab(tab) {
      if (tab === currentTab) return;

      const tabIndex = ['workout', 'editor', 'analytics', 'settings'].indexOf(tab);
      const indicator = document.getElementById('tabIndicator');
      indicator.style.transform = `translateX(${tabIndex * 100}%)`;

      document.querySelectorAll('.tab-item').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

      if (tab === 'workout') renderWorkoutScreen();
      else if (tab === 'editor') renderEditor();
      else if (tab === 'analytics') renderAnalytics();
      else if (tab === 'settings') renderSettings();

      document.getElementById(`screen-${tab}`).classList.add('active');
      currentTab = tab;
    }

    /* ============================================================
       INIT
       ============================================================ */
    function init() {
      renderWorkoutScreen();
      renderEditor();
      renderAnalytics();
      renderSettings();

      // Tab indicator initial position
      const indicator = document.getElementById('tabIndicator');
      indicator.style.width = `calc(25% - 12px)`;
      indicator.style.left = '6px';

      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      document.getElementById('pauseBtn').addEventListener('click', togglePause);
      document.getElementById('resumeBtn').addEventListener('click', togglePause);
      document.getElementById('endFromPauseBtn').addEventListener('click', () => {
        showModal('End Workout?', 'Your progress for this session will be lost.', () => {
          endWorkout();
        }, 'End Workout', true);
      });
      document.getElementById('doneBtn').addEventListener('click', endWorkout);

      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modalOverlay')) closeModal();
      });

      // Update pause time periodically
      setInterval(() => {
        if (workout && workout.paused) updatePauseTime();
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
